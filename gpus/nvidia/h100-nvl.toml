# Dense (non-sparse) peak tensor throughput; INT8 in TOPS.
# NOT the same as H100 SXM (dense fp16 989) — NVIDIA's H100 NVL datasheet gives
# 1,671 fp16 with sparsity, so 835.5 dense. Some third-party pages wrongly
# repeat the SXM figures for this part.
[compute]
tf32 = 417.5
fp16 = 835.5
bf16 = 835.5
fp8 = 1670.5
int8 = 1670.5
